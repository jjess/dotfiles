# ── General ──────────────────────────────────────────────

set -g default-terminal "tmux-256color"
set -g status-position bottom
set -g status-interval 5

# Mejor experiencia visual
set -g mouse on
setw -g mode-keys vi

# ── OSC52 / clipboard ────────────────────────────────────

set -g set-clipboard on
set -g allow-passthrough on

# Permite copiar desde el modo copy-mode con OSC52
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode y send-keys -X copy-selection-and-cancel

# ── Keys ──────────────────────────────────────────────

set -g extended-keys on

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# para cambiar entre layouts
# e intercambiar paneles
# c-b {
# c-b }
# c-b space

# para resize de tmux panes
# con teclado:
# c-b Alt y teclas del cursor

# Popup terminal
bind-key p display-popup \
    -E \
    -w 80% \
    -h 80% \
    -d "#{pane_current_path}" \
    'bash'

# ── Plugins ──────────────────────────────────────────────

set -g @plugin 'tmux-plugins/tpm'

#set -g @plugin 'dracula/tmux'

# Dracula: opciones
#set -g @dracula-show-powerline true
#set -g @dracula-show-left-icon session
#set -g @dracula-show-flags true

# Solo hora; elimina network y weather
#set -g @dracula-plugins "time"
#set -g @dracula-military-time true
#set -g @dracula-show-timezone true


set -g @plugin 'catppuccin/tmux#v2.3.0' # See https://github.com/catppuccin/tmux/tags for additional tags



# TPM debe ir al final
run '~/.tmux/plugins/tpm/tpm'
